# Identificação do aplicativo.
name: mingru
description: "Aplicativo da loja streetwear Mingru."

# Publicação desabilitada no pub.dev.
publish_to: 'none'

# Versão e número da compilação.
version: 1.0.0+1

# Versão compatível do Dart.
environment:
  sdk: ^3.11.0

# Dependências do aplicativo.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  intl: ^0.20.3

# Ferramentas de testes e análise.
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Recursos do Flutter.
flutter:
  uses-material-design: true

  # Imagens locais.
  assets:
    - assets/images/

  # Fontes — família Poppins e seus pesos.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700